<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>차근차근 · 나의 칸반 보드</title>
<style>
:root{--bg:#f6f7fb;--ink:#202936;--muted:#626d7e;--line:#e2e6ed;--purple:#6154cf;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,'Apple SD Gothic Neo','Nanum Gothic',sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a99ff0;outline-offset:3px}button{border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:10px 14px}button:hover{background:#f2f1fc}.primary{background:var(--purple);border-color:var(--purple);color:white}.primary:hover{background:#5144bd}header{background:white;border-bottom:1px solid var(--line);padding:20px 4vw;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:20px;font-weight:800;display:flex;gap:10px;align-items:center}.logo{background:var(--purple);color:white;border-radius:10px;padding:6px 10px}.local{color:var(--muted);font-size:12px}main{max-width:1500px;margin:auto;padding:36px 4vw}.intro{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:30px;margin:0 0 9px;letter-spacing:-1px}.subtitle{margin:0;color:var(--muted);line-height:1.7}.date{font-size:13px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:27px 0}.stat{background:white;border:1px solid var(--line);border-radius:13px;padding:18px 21px;display:flex;justify-content:space-between;align-items:center}.stat span{color:var(--muted)}.stat strong{font-size:26px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:23px}.search{flex:1;min-width:200px}.toolbar input,.toolbar select{border:1px solid var(--line);background:white;border-radius:9px;padding:11px 13px;color:var(--ink)}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}.column{background:#edf0f5;border:1px solid #e3e7ef;border-radius:14px;min-height:360px;padding:16px;transition:background .15s}.column.over{background:#e3dffb;outline:2px dashed var(--purple)}.col-head{display:flex;align-items:center;gap:8px;margin-bottom:17px}.col-head h2{font-size:15px;margin:0}.dot{width:9px;height:9px;border-radius:50%;background:#7a8596}.doing .dot{background:#a17418}.done .dot{background:#268567}.count{background:#e0e4ec;color:#4c586a;padding:2px 7px;border-radius:6px;font-size:12px}.add-small{margin-left:auto;border:0;background:transparent;font-size:23px;padding:0 8px;color:#667085}.cards{min-height:200px}.card{background:white;border:1px solid #e2e5ed;border-radius:11px;padding:17px;margin-bottom:12px;box-shadow:0 2px 4px #26305204;cursor:grab}.card:active{cursor:grabbing}.card.dragging{opacity:.4}.card-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.badge{font-size:11px;border-radius:5px;padding:3px 7px;font-weight:650}.high{color:#a52d42;background:#fcebf0}.normal{color:#65511e;background:#fcf3d8}.low{color:#346d62;background:#e8f5ef}.edit{border:0;padding:2px 7px;font-size:19px;color:#657084;background:transparent}.card h3{font-size:15px;line-height:1.6;margin:10px 0 5px;overflow-wrap:anywhere}.card p{font-size:13px;line-height:1.65;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 14px}.card-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #f0f1f5;padding-top:12px;gap:8px;font-size:12px;color:var(--muted)}.card-foot select{max-width:115px;border:1px solid var(--line);border-radius:6px;padding:4px;background:white;color:#586376;font-size:12px}.overdue{color:#ae3043!important}.empty{text-align:center;color:#727d8d;padding:48px 6px;line-height:1.9;font-size:13px}.column-add{display:block;width:100%;background:transparent;border:1px dashed #c5ccd8;color:#616e81;text-align:left}.footer{margin:24px 0;color:var(--muted);font-size:12px;line-height:1.8;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.file-tools{display:flex;gap:8px}.file-tools button{font-size:12px;background:transparent;padding:5px 9px}dialog{border:1px solid var(--line);border-radius:17px;padding:28px;width:min(510px,92vw);box-shadow:0 20px 100px #17203d30}dialog::backdrop{background:#18203866}dialog h2{margin:0 0 22px;font-size:21px}.field{display:block;margin-bottom:17px;font-weight:600;font-size:13px}.field input,.field textarea,.field select{display:block;width:100%;padding:11px;border:1px solid #cbd1dc;border-radius:8px;margin-top:7px;background:white;color:var(--ink);font-weight:400}.field textarea{resize:vertical;min-height:100px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:23px}.danger{margin-right:auto;color:#ad3044}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 22px;background:#283247;color:white;border-radius:10px;box-shadow:0 5px 24px #0002;z-index:10;max-width:90vw}.hidden{display:none}@media(max-width:760px){header{padding:16px 5vw}.local{max-width:120px;text-align:right}.intro{align-items:flex-start}.date{display:none}main{padding:25px 5vw}.stats{gap:8px}.stat{padding:13px 12px;display:block}.stat strong{display:block;margin-top:5px;font-size:24px}.board{grid-template-columns:1fr}.column{min-height:220px}.cards{min-height:90px}h1{font-size:26px}.intro .primary{white-space:nowrap}.toolbar select{flex:1}}
</style>
</head>
<body>
<header><div class="brand"><span class="logo" aria-hidden="true">✓</span>차근차근</div><div class="local">개인 워크스페이스 · 로컬 저장</div></header>
<main>
<section class="intro"><div><h1>나의 할 일 보드</h1><p class="subtitle">머릿속 할 일을 꺼내고, 하나씩 완료해 보세요.</p></div><button class="primary" id="newTask">＋ 할 일 추가</button></section>
<div class="stats" aria-label="전체 할 일 현황"><div class="stat"><span>전체 할 일</span><strong id="total">0</strong></div><div class="stat"><span>진행 중</span><strong id="active">0</strong></div><div class="stat"><span>완료율</span><strong id="rate">0%</strong></div></div>
<div class="toolbar"><input class="search" id="search" type="search" placeholder="할 일 제목이나 메모 검색" aria-label="할 일 검색"><select id="priorityFilter" aria-label="우선순위 필터"><option value="all">모든 우선순위</option><option value="high">높음</option><option value="normal">보통</option><option value="low">낮음</option></select><select id="sort" aria-label="정렬"><option value="new">최신 등록순</option><option value="due">마감일순</option><option value="priority">우선순위순</option></select></div>
<section class="board" aria-label="칸반 보드" id="board"></section>
<div class="footer"><span id="saveStatus" role="status">변경사항은 이 브라우저에 자동 저장됩니다.<br>카드를 드래그하거나 카드의 상태 메뉴로 이동하세요.</span><div class="file-tools"><button id="export">백업 내보내기</button><button id="import">백업 불러오기</button></div></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
</main>
<dialog id="editor" aria-labelledby="dialogTitle"><form id="taskForm"><h2 id="dialogTitle">새 할 일</h2><label class="field">제목 *<input id="title" maxlength="150" required placeholder="어떤 일을 할까요?"></label><label class="field">메모<textarea id="description" maxlength="5000" placeholder="세부 내용이나 기억할 내용을 적어 주세요."></textarea></label><div class="form-row"><label class="field">상태<select id="status"><option value="todo">할 일</option><option value="doing">진행 중</option><option value="done">완료</option></select></label><label class="field">우선순위<select id="priority"><option value="normal">보통</option><option value="high">높음</option><option value="low">낮음</option></select></label></div><label class="field">마감일<input type="date" id="due"></label><div class="actions"><button type="button" class="danger" id="delete">삭제</button><button type="button" id="cancel">취소</button><button type="submit" class="primary">저장하기</button></div></form></dialog>
<div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const KEY='chageun-kanban-v1';
const labels={todo:'할 일',doing:'진행 중',done:'완료'}, priorities={high:'높음',normal:'보통',low:'낮음'};
const $=id=>document.getElementById(id);
let tasks=[],editing=null,dragging=null,timer;
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
function valid(t){return t&&typeof t.id==='string'&&typeof t.title==='string'&&t.title.trim()&&t.title.length<=150&&typeof t.description==='string'&&t.description.length<=5000&&Object.hasOwn(labels,t.status)&&Object.hasOwn(priorities,t.priority)&&typeof t.due==='string'&&(t.due===''||/^\d{4}-\d{2}-\d{2}$/.test(t.due))&&Number.isFinite(t.created)}
function notify(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.add('hidden'),3500)}
try{const data=localStorage.getItem(KEY);if(data!==null){const parsed=JSON.parse(data);if(!Array.isArray(parsed)||!parsed.every(valid))throw Error();tasks=parsed}}catch(e){$('saveStatus').textContent='저장 데이터를 읽지 못했습니다. 기존 데이터를 덮어쓰지 않도록 백업을 확인해 주세요.';notify('기존 데이터를 읽지 못했습니다. 백업 파일이 있으면 불러와 주세요.')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks));$('saveStatus').textContent='자동 저장됨 · 카드를 드래그하거나 상태 메뉴로 이동하세요.'}catch(e){$('saveStatus').textContent='브라우저 저장 실패 · 백업 내보내기로 데이터를 보관하세요.';notify('저장 공간 또는 브라우저 설정 때문에 저장하지 못했습니다.')}render()}
function text(tag,content,cls){const el=document.createElement(tag);el.textContent=content;if(cls)el.className=cls;return el}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function render(){
$('total').textContent=tasks.length;$('active').textContent=tasks.filter(t=>t.status==='doing').length;$('rate').textContent=tasks.length?Math.round(tasks.filter(t=>t.status==='done').length/tasks.length*100)+'%':'0%';
const query=$('search').value.trim().toLocaleLowerCase(),filter=$('priorityFilter').value;
const visible=tasks.filter(t=>(filter==='all'||t.priority===filter)&&`${t.title} ${t.description}`.toLocaleLowerCase().includes(query));
const weights={high:0,normal:1,low:2};visible.sort((a,b)=>$('sort').value==='due'?(a.due||'9999').localeCompare(b.due||'9999')||b.created-a.created:$('sort').value==='priority'?weights[a.priority]-weights[b.priority]||b.created-a.created:b.created-a.created);
$('board').replaceChildren();
for(const [status,label] of Object.entries(labels)){
const col=text('section','','column '+status);col.dataset.status=status;col.setAttribute('aria-label',label);
const head=text('div','','col-head');head.append(text('span','','dot'),text('h2',label),text('span',String(visible.filter(t=>t.status===status).length),'count'));const add=text('button','＋','add-small');add.setAttribute('aria-label',label+'에 추가');add.onclick=()=>openEditor(null,status);head.append(add);col.append(head);
const list=text('div','','cards');const group=visible.filter(t=>t.status===status);
if(!group.length)list.append(text('div',query||filter!=='all'?'조건에 맞는 할 일이 없어요.':status==='done'?'완료한 일이 여기에 모여요.':'새 할 일을 추가해 보세요.','empty'));
for(const t of group){const card=text('article','','card');card.draggable=true;card.dataset.id=t.id;
const top=text('div','','card-top');const edit=text('button','⋯','edit');edit.setAttribute('aria-label',t.title+' 수정');edit.onclick=()=>openEditor(t.id);top.append(text('span',priorities[t.priority],'badge '+t.priority),edit);card.append(top,text('h3',t.title));if(t.description)card.append(text('p',t.description));
const foot=text('div','','card-foot');const due=text('span',t.due?'◷ '+t.due:'마감일 없음');if(t.due&&t.due<today()&&t.status!=='done'){due.className='overdue';due.textContent+=' · 지연'}
const select=document.createElement('select');select.setAttribute('aria-label',t.title+' 상태 변경');for(const [v,l]of Object.entries(labels)){const opt=text('option',l);opt.value=v;select.append(opt)}select.value=t.status;select.onchange=()=>{t.status=select.value;save()};foot.append(due,select);card.append(foot);
card.addEventListener('dragstart',e=>{if(e.target.closest('button,select')){e.preventDefault();return}dragging=t.id;e.dataTransfer.setData('text/plain',t.id);e.dataTransfer.effectAllowed='move';card.classList.add('dragging')});card.addEventListener('dragend',()=>{dragging=null;document.querySelectorAll('.over,.dragging').forEach(el=>el.classList.remove('over','dragging'))});list.append(card)}
col.append(list);const bottom=text('button','＋ 할 일 추가','column-add');bottom.onclick=()=>openEditor(null,status);col.append(bottom);
col.addEventListener('dragover',e=>{if(dragging){e.preventDefault();e.dataTransfer.dropEffect='move';col.classList.add('over')}});col.addEventListener('dragleave',e=>{if(!col.contains(e.relatedTarget))col.classList.remove('over')});col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');const task=tasks.find(t=>t.id===dragging);if(task){task.status=status;dragging=null;save()}});$('board').append(col)
}}
function openEditor(id=null,status='todo'){editing=id;const t=tasks.find(t=>t.id===id);$('taskForm').reset();$('dialogTitle').textContent=t?'할 일 수정':'새 할 일';$('title').value=t?.title||'';$('description').value=t?.description||'';$('status').value=t?.status||status;$('priority').value=t?.priority||'normal';$('due').value=t?.due||'';$('delete').hidden=!t;$('editor').showModal();$('title').focus()}
$('newTask').onclick=()=>openEditor();$('cancel').onclick=()=>$('editor').close();
$('title').addEventListener('input',()=>$('title').setCustomValidity(''));
$('taskForm').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim();if(!title){$('title').setCustomValidity('제목을 입력해 주세요.');$('title').reportValidity();return}const values={title,description:$('description').value.trim(),status:$('status').value,priority:$('priority').value,due:$('due').value};if(editing){const t=tasks.find(t=>t.id===editing);if(t)Object.assign(t,values)}else tasks.push({id:uid(),created:Date.now(),...values});save();$('editor').close();notify('할 일을 저장했습니다.')};
$('delete').onclick=()=>{if(confirm('이 할 일을 삭제할까요? 삭제 후 되돌릴 수 없습니다.')){tasks=tasks.filter(t=>t.id!==editing);save();$('editor').close();notify('할 일을 삭제했습니다.')}};
for(const id of ['search','priorityFilter','sort'])$(id).addEventListener(id==='search'?'input':'change',render);
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),tasks},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='kanban-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('백업 파일을 내보냈습니다.')};
$('import').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>5*1024*1024)throw Error('파일 크기가 5MB를 초과합니다.');const data=JSON.parse(await f.text()),items=Array.isArray(data)?data:data.tasks;if(!Array.isArray(items)||!items.every(valid)||new Set(items.map(t=>t.id)).size!==items.length)throw Error('올바른 칸반 백업 파일이 아닙니다.');if(confirm(`현재 목록을 백업의 ${items.length}개 할 일로 교체할까요? 기존 목록은 먼저 내보내기로 보관해 주세요.`)){tasks=items.map(t=>({id:t.id,title:t.title.trim(),description:t.description,status:t.status,priority:t.priority,due:t.due,created:t.created}));save();notify('백업을 불러왔습니다.')}}catch(err){notify(err instanceof SyntaxError?'JSON 파일 형식이 올바르지 않습니다.':err.message)}finally{e.target.value=''}};
window.addEventListener('storage',e=>{if(e.key===KEY){try{const next=e.newValue?JSON.parse(e.newValue):[];if(Array.isArray(next)&&next.every(valid)){tasks=next;render();notify('다른 탭의 변경사항을 반영했습니다.')}}catch{}}});render();
</script>
</body>
</html>
